problem:
  instance:
    C: 64
    H: 1
    Hdilation: 1
    Hstride: 1
    K: 128
    N: 1
    P: 60
    Q: 6
    R: 3
    S: 3
    Wdilation: 1
    Wstride: 1
    type: C2D
  shape:
    coefficients:
    - default: 1
      name: Wstride
    - default: 1
      name: Hstride
    - default: 1
      name: Wdilation
    - default: 1
      name: Hdilation
    data_spaces:
    - name: Weights
      projection:
      - - - H
      - - - C
      - - - K
      - - - R
      - - - S
    - name: Inputs
      projection:
      - - - N
      - - - H
      - - - C
      - - - R
          - Wdilation
        - - P
          - Wstride
      - - - S
          - Hdilation
        - - Q
          - Hstride
    - name: Outputs
      projection:
      - - - N
      - - - H
      - - - K
      - - - Q
      - - - P
      read_write: true
    dimensions:
    - H
    - C
    - K
    - R
    - S
    - N
    - P
    - Q
    name: CNN_Layer
