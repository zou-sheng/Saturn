problem:
  instance:
    C: 1
    H: 1
    Hdilation: 8
    Hstride: 8
    K: 32
    N: 1
    P: 151
    Q: 40
    R: 5
    S: 20
    Wdilation: 8
    Wstride: 2
    type: C2D
  shape:
    coefficients:
    - default: 1
      name: Wstride
    - default: 1
      name: Hstride
    - default: 1
      name: Wdilation
    - default: 1
      name: Hdilation
    data_spaces:
    - name: Weights
      projection:
      - - - H
      - - - C
      - - - K
      - - - R
      - - - S
    - name: Inputs
      projection:
      - - - N
      - - - H
      - - - C
      - - - R
          - Wdilation
        - - P
          - Wstride
      - - - S
          - Hdilation
        - - Q
          - Hstride
    - name: Outputs
      projection:
      - - - N
      - - - H
      - - - K
      - - - Q
      - - - P
      read_write: true
    dimensions:
    - H
    - C
    - K
    - R
    - S
    - N
    - P
    - Q
    name: CNN_Layer
